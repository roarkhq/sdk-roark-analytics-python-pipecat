[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-roark"
version = "0.1.5"
description = "Roark analytics observer for Pipecat — capture call lifecycle, transcripts, tool calls, and recordings from any Pipecat pipeline."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Roark", email = "support@roark.ai" }]
keywords = ["pipecat", "voice-ai", "observability", "roark", "analytics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  # pipecat-ai is required at runtime — observer subclasses BaseObserver from this package.
  # >=0.0.104 dispatches the observer lifecycle hook used to post call-started.
  # Keep <1 to opt into pre-1.0 caution.
  "pipecat-ai>=0.0.104,<1",
  # httpx for the Roark webhook + presigned-upload calls. Async-native, supports
  # connection pooling, and matches Pipecat's own async runtime.
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
]
# Only needed to load .env when running the example locally — the library
# itself reads env vars directly via os.environ.
examples = [
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://roark.ai"
Documentation = "https://docs.roark.ai/integrations/pipecat"
Repository = "https://github.com/roarkhq/sdk-roark-analytics-python-pipecat"
Issues = "https://github.com/roarkhq/sdk-roark-analytics-python-pipecat/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_roark"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
